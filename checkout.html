<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>تسویه حساب | Aris Beauty</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


<header class="header">

    <div class="container header-inner">

        <a href="index.html" class="logo">
            <span>ARIS</span>
            <small>BEAUTY</small>
        </a>

        <nav class="nav">

            <a href="index.html">
                خانه
            </a>

            <a href="shop.html">
                فروشگاه
            </a>

            <a href="cart.html">
                سبد خرید
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="page-hero">

        <div class="container">

            <span>
                CHECKOUT
            </span>

            <h1>
                تکمیل سفارش
            </h1>

            <p>
                اطلاعات ارسال خود را وارد کنید.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container checkout-layout">


            <form
                id="checkoutForm"
                class="checkout-form">

                <h2>
                    اطلاعات مشتری
                </h2>


                <label>
                    نام و نام خانوادگی
                </label>

                <input
                    type="text"
                    id="customerName"
                    required
                    placeholder="مثلاً مهران احمدی">


                <label>
                    شماره موبایل
                </label>

                <input
                    type="tel"
                    id="customerPhone"
                    required
                    placeholder="۰۹۱۲۱۲۳۴۵۶۷">


                <label>
                    استان
                </label>

                <input
                    type="text"
                    id="province"
                    required
                    placeholder="استان">


                <label>
                    شهر
                </label>

                <input
                    type="text"
                    id="city"
                    required
                    placeholder="شهر">


                <label>
                    آدرس کامل
                </label>

                <textarea
                    id="address"
                    required
                    rows="5"
                    placeholder="آدرس کامل محل تحویل"></textarea>


                <label>
                    کد پستی
                </label>

                <input
                    type="text"
                    id="postalCode"
                    required
                    placeholder="کد پستی">


                <button
                    type="submit"
                    class="btn btn-primary full-btn">

                    ثبت سفارش

                </button>

            </form>


            <aside class="checkout-summary">

                <h2>
                    خلاصه سفارش
                </h2>

                <div id="checkoutItems"></div>

                <div class="summary-total">

                    <span>
                        مبلغ نهایی
                    </span>

                    <strong id="checkoutTotal">
                        ۰ تومان
                    </strong>

                </div>

            </aside>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-bottom">
        © 2026 Aris Beauty
    </div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
