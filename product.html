<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>محصول | Aris Beauty</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


<header class="header">

    <div class="container header-inner">

        <a href="index.html" class="logo">
            <span>ARIS</span>
            <small>BEAUTY</small>
        </a>

        <nav class="nav">

            <a href="index.html">
                خانه
            </a>

            <a href="shop.html">
                فروشگاه
            </a>

            <a href="about.html">
                درباره ما
            </a>

            <a href="contact.html">
                تماس با ما
            </a>

        </nav>

        <div class="header-actions">

            <button
                class="icon-btn cart-icon"
                type="button"
                onclick="location.href='cart.html'">

                🛒

                <span
                    id="cartCount"
                    class="cart-count">
                    0
                </span>

            </button>

            <button
                class="icon-btn menu-toggle"
                type="button">
                ☰
            </button>

        </div>

    </div>

</header>


<main>

    <section class="product-details">

        <div class="product-detail-image">

            <div
                id="detailImage"
                class="detail-placeholder">
                💄
            </div>

        </div>


        <div class="product-detail-info">

            <span
                id="detailCategory"
                class="product-category">
                دسته‌بندی
            </span>

            <h1 id="detailName">
                محصول
            </h1>

            <div class="product-rating">
                ★★★★★

                <span>
                    ۴.۹ از ۵
                </span>
            </div>

            <p
                id="detailDescription"
                class="product-description">
                توضیحات محصول
            </p>

            <div
                id="detailPrice"
                class="product-price">
                ۰ تومان
            </div>


            <div class="quantity-box">

                <span>
                    تعداد:
                </span>

                <div class="quantity">

                    <button
                        type="button"
                        id="decrease">
                        −
                    </button>

                    <span id="quantity">
                        1
                    </span>

                    <button
                        type="button"
                        id="increase">
                        +
                    </button>

                </div>

            </div>


            <button
                type="button"
                id="addToCart"
                class="add-to-cart">

                افزودن به سبد خرید 🛒

            </button>


            <div class="product-benefits">

                <div>
                    ✓ کیفیت تضمین‌شده
                </div>

                <div>
                    ✓ ارسال سریع
                </div>

                <div>
                    ✓ پشتیبانی قبل و بعد از خرید
                </div>

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-bottom">
        © 2026 Aris Beauty
    </div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
