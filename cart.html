<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>سبد خرید | Aris Beauty</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


<header class="header">

    <div class="container header-inner">

        <a href="index.html" class="logo">
            <span>ARIS</span>
            <small>BEAUTY</small>
        </a>

        <nav class="nav">

            <a href="index.html">
                خانه
            </a>

            <a href="shop.html">
                فروشگاه
            </a>

            <a href="about.html">
                درباره ما
            </a>

            <a href="contact.html">
                تماس با ما
            </a>

        </nav>

        <div class="header-actions">

            <button
                class="icon-btn cart-icon"
                type="button">

                🛒

                <span
                    id="cartCount"
                    class="cart-count">
                    0
                </span>

            </button>

        </div>

    </div>

</header>


<main>

    <section class="page-hero">

        <div class="container">

            <span>
                SHOPPING CART
            </span>

            <h1>
                سبد خرید
            </h1>

            <p>
                محصولات انتخاب‌شده شما
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container cart-layout">


            <div
                id="cartItems"
                class="cart-items">
            </div>


            <aside class="cart-summary">

                <h2>
                    خلاصه سفارش
                </h2>


                <div class="summary-row">

                    <span>
                        جمع محصولات
                    </span>

                    <strong id="cartSubtotal">
                        ۰ تومان
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        ارسال
                    </span>

                    <strong id="shipping">
                        ۰ تومان
                    </strong>

                </div>


                <div class="coupon">

                    <input
                        type="text"
                        id="couponInput"
                        placeholder="کد تخفیف">

                    <button
                        type="button"
                        id="couponButton">

                        اعمال

                    </button>

                </div>


                <div
                    id="couponMessage"
                    class="coupon-message">
                </div>


                <div class="summary-total">

                    <span>
                        مبلغ نهایی
                    </span>

                    <strong id="cartTotal">
                        ۰ تومان
                    </strong>

                </div>


                <button
                    type="button"
                    id="checkoutButton"
                    class="checkout-button">

                    ادامه فرآیند خرید

                </button>

            </aside>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-bottom">
        © 2026 Aris Beauty
    </div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
