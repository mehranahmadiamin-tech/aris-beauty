<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>تماس با ما | Aris Beauty</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


<header class="header">

    <div class="container header-inner">

        <a href="index.html" class="logo">
            <span>ARIS</span>
            <small>BEAUTY</small>
        </a>

        <nav class="nav">

            <a href="index.html">
                خانه
            </a>

            <a href="shop.html">
                فروشگاه
            </a>

            <a href="about.html">
                درباره ما
            </a>

            <a href="contact.html" class="active">
                تماس با ما
            </a>

        </nav>

        <div class="header-actions">

            <button
                class="icon-btn cart-icon"
                onclick="location.href='cart.html'">

                🛒

                <span
                    id="cartCount"
                    class="cart-count">
                    0
                </span>

            </button>

        </div>

    </div>

</header>


<main>

    <section class="page-hero">

        <div class="container">

            <span>
                CONTACT US
            </span>

            <h1>
                با ما در ارتباط باش
            </h1>

            <p>
                سوالی داری؟ خوشحال می‌شویم کمکت کنیم.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container contact-grid">


            <div class="contact-info">

                <h2>
                    راه‌های ارتباطی
                </h2>

                <div class="contact-item">

                    <span>
                        📞
                    </span>

                    <div>
                        <strong>
                            تلفن
                        </strong>

                        <p>
                            ۰۲۱-۱۲۳۴۵۶۷۸
                        </p>
                    </div>

                </div>


                <div class="contact-item">

                    <span>
                        ✉️
                    </span>

                    <div>
                        <strong>
                            ایمیل
                        </strong>

                        <p>
                            info@arisbeauty.ir
                        </p>
                    </div>

                </div>


                <div class="contact-item">

                    <span>
                        📍
                    </span>

                    <div>
                        <strong>
                            آدرس
                        </strong>

                        <p>
                            تهران، خیابان نمونه
                        </p>
                    </div>

                </div>

            </div>


            <form class="contact-form">

                <input
                    type="text"
                    placeholder="نام شما"
                    required>

                <input
                    type="email"
                    placeholder="ایمیل شما"
                    required>

                <textarea
                    rows="6"
                    placeholder="پیام شما..."
                    required></textarea>

                <button
                    type="submit"
                    class="btn btn-primary">

                    ارسال پیام

                </button>

            </form>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-bottom">
        © 2026 Aris Beauty
    </div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
